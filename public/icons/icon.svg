<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background rounded box filling frame -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#0b0f19" stroke="url(#bgGrad)" stroke-width="5" />

  <!-- Layer 1 (Top) -->
  <polygon points="64,20 110,44 64,68 18,44" fill="url(#layer1Grad)" opacity="0.95" />

  <!-- Layer 2 (Middle) -->
  <polygon points="64,44 110,68 64,92 18,68" fill="url(#layer2Grad)" opacity="0.85" />

  <!-- Layer 3 (Bottom) -->
  <polygon points="64,68 110,92 64,116 18,92" fill="url(#layer3Grad)" opacity="0.95" />

  <!-- Center highlight sparkle -->
  <circle cx="64" cy="44" r="5" fill="#ffffff" />
</svg>