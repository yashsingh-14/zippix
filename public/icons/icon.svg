<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a" stroke="url(#bgGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Layer 1 -->
  <polygon points="64,26 96,44 64,62 32,44" fill="url(#bgGrad)" opacity="0.95" />

  <!-- Layer 2 -->
  <polygon points="64,48 96,66 64,84 32,66" fill="#38bdf8" opacity="0.8" />

  <!-- Layer 3 -->
  <polygon points="64,70 96,88 64,106 32,88" fill="#818cf8" opacity="0.9" />

  <!-- Center highlight sparkle -->
  <circle cx="64" cy="44" r="3.5" fill="#ffffff" />
</svg>
